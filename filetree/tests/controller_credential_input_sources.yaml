---
controller_credential_input_sources:
  - target_credential: github
    source_credential: AWSSecretManager
    input_field_name: git_host
    description:
    metadata:
      region_name: us-east-1
      secret_name: github/url_casc_project
  - target_credential: github
    source_credential: AWSSecretManager
    input_field_name: git_token
    description:
    metadata:
      region_name: us-east-1
      secret_name: github/token
  - target_credential: github
    source_credential: AWSSecretManager
    input_field_name: git_user
    description:
    metadata:
      region_name: us-east-1
      secret_name: github/user_casc_project
  - target_credential: AAP_Login
    source_credential: AWSSecretManager
    input_field_name: host
    description:
    metadata:
      region_name: us-east-1
      secret_name: aap/url
  - target_credential: AAP_Login
    source_credential: AWSSecretManager
    input_field_name: password
    description:
    metadata:
      region_name: us-east-1
      secret_name: aap/password
  - target_credential: AAP_Login
    source_credential: AWSSecretManager
    input_field_name: username
    description:
    metadata:
      region_name: us-east-1
      secret_name: aap/user
  - target_credential: SourceControlGitHub
    source_credential: AWSSecretManager
    input_field_name: ssh_key_data
    description:
    metadata:
      region_name: us-east-1
      secret_name: github/clave-privada-buena
...
