---
controller_credential_types:
  - name: "git"
    description: |-
      {%- raw -%}
      git
      {%- endraw -%}
    kind: "cloud"
    inputs:
        fields:
          - id: git_host
            type: string
            label: Git Server Host
            help_text: Git Server Host
          - id: git_user
            type: string
            label: Git Username
            help_text: The username for Git authentication.
          - id: git_token
            type: string
            label: Git token
            secret: true
            help_text: The token for Git authentication.
        required:
          - git_host
          - git_user
          - git_token

    injectors:
        extra_vars:
          git_host: "{%- raw -%} '{{ git_host }}' {%- endraw -%}"
          git_user: "{%- raw -%} '{{ git_user }}' {%- endraw -%}"
          git_token: "{%- raw -%} '{{ git_token }}' {%- endraw -%}"

...
