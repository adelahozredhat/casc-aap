---
controller_credentials:
  - name: "AWSSecretManager"
    credential_type: "AWS Secrets Manager lookup"
    organization: "Default"
    inputs:
      aws_access_key: mock
      aws_secret_key: "{{ vaulted_controller_credentials_awssecretmanager_aws_secret_key }}"
  - name: "SourceControlGitHub"
    credential_type: "Source Control"
    organization: "Default"
  - name: "Demo Credential"
    credential_type: "Machine"
    organization: "ORGANIZATIONLESS"
    inputs:
      username: admin
  - name: "Ansible Galaxy"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    organization: "ORGANIZATIONLESS"
    inputs:
      url: https://galaxy.ansible.com/
  - name: "AAP_Login"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "ORGANIZATIONLESS"
    inputs:
      verify_ssl: false
  - name: "github"
    credential_type: "git"
    organization: "ORGANIZATIONLESS"
  - name: "AutomationHub"
    credential_type: "Ansible Galaxy/Automation Hub API Token"
    organization: "ORGANIZATIONLESS"
    inputs:
      url: https://example-ansible-automation-platform.apps.cluster-f48lr.dynamic2.redhatworkshops.io/api/galaxy/content/rh-certified/
      token: "{{ vaulted_controller_credentials_automationhub_token }}"
...
